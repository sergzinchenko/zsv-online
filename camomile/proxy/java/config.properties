# Конфигурация локального прокси. Правьте значения и перезапустите прокси.
# Файл ищется по -Dconfig.file=<путь>, затем в рабочем каталоге, затем рядом с jar.
# Неверное значение — прокси не стартует и говорит, что именно исправить.

# ---- Сервер ----
# Интерфейс, на котором слушает прокси. 127.0.0.1 = только этот компьютер.
# Менять на 0.0.0.0 стоит, только заполнив allowlist: иначе любой в сети сможет
# ходить через прокси, в том числе под вашей доменной учётной записью.
bindAddress=127.0.0.1

# Порт, на котором прокси слушает входящие запросы из браузера.
port=3000

# Ограничение рабочих потоков и очереди ожидающих запросов.
threads.max=64
threads.queueSize=256

# Сколько секунд давать текущим запросам доработать при остановке (Ctrl+C).
shutdownTimeoutSec=5

# ---- Допуск запросов ----
# Разрешённые HTTP-методы через запятую.
allowedMethods=GET,POST,PUT,DELETE,PATCH,HEAD

# Белый список хостов, куда прокси разрешено ходить (защита от SSRF).
# Формы записи: host | host:port | *.suffix (домен и все поддомены).
# Пусто = ограничений по имени нет, подходит только для локальной разработки.
allowlist=

# Запрещать цели, которые разрешаются в петлевой, приватный или link-local адрес
# (в том числе 169.254.169.254). Хосты, явно перечисленные в allowlist,
# проверку проходят — так разрешаются внутренние ресурсы.
blockPrivateTargets=true

# Адреса (origin), с которых открывается агент, через запятую. ОБЯЗАТЕЛЬНО:
# только им прокси разрешает сопряжение и запросы. Пример:
#   allowedOrigins=https://agent.corp.local,http://127.0.0.1:5500
# Пусто — прокси не запустится (кроме открытого режима pairing.required=false).
allowedOrigins=

# ---- Доступ к прокси: сопряжение с агентом ----
# Каждый запрос несёт токен (заголовок X-Agent-Host-Token), который агент
# получает один раз: в агенте Настройки → Локальный хост → «Сопрячь», затем
# подтверждение на странице прокси. Без этого прокси с SSO доступен любому
# процессу на машине.
# false — прежний открытый режим без токена. Не включайте его вместе с SSO.
pairing.required=true

# Где хранить сопряжения (хранятся только хэши токенов). Пусто —
# %LOCALAPPDATA%\proxy-sso\pairings.tsv. Удалите файл, чтобы отозвать все.
pairing.file=

# Клиент должен быть в том же сеансе Windows, что и прокси. Защищает от других
# пользователей той же машины (RDS, VDI), у которых тот же 127.0.0.1.
session.check=true

# Допустимые значения заголовка Host сверх адресов самого прокси
# (127.0.0.1:port, localhost:port). Нужны, только если bindAddress не петлевой.
hostHeaders=

# Заголовки ответа, которые браузер разрешает прочитать скрипту
# (Access-Control-Expose-Headers). Без них из JS видны только простые
# заголовки, то есть, например, Mcp-Session-Id прочитать нельзя.
# Пусто = заголовок не отдаётся вовсе.
cors.exposeHeaders=Mcp-Session-Id, MCP-Protocol-Version, Content-Type

# Список разрешённых заголовков запроса (Access-Control-Allow-Headers)
# настраивать не нужно: прокси отдаёт свой базовый набор плюс всё, что
# браузер перечислил в Access-Control-Request-Headers конкретного preflight.

# Максимальный размер тела входящего запроса от браузера, в байтах.
maxRequestBodyBytes=10485760

# Максимальный размер ответа цели, в байтах.
maxResponseBytes=20971520

# ---- Таймауты, в секундах ----
http.connectTimeoutSec=10
http.readTimeoutSec=60

# ---- Логирование ----
# ERROR | WARN | INFO | DEBUG. Заголовки и тела пишутся только на DEBUG.
log.level=INFO

# Подсветка вывода: auto | always | never.
# auto    — цвет только в настоящей консоли; при перенаправлении в файл
#           escape-последовательности не пишутся. В консоли Windows режим
#           обработки ANSI включается автоматически, а если не получилось
#           (например, старая версия Windows) — прокси молча остаётся без цвета.
# always  — раскрашивать всегда, в том числе перенаправленный вывод.
# never   — никогда.
# Переменная окружения NO_COLOR отключает подсветку в режиме auto.
log.color=auto
log.headers=true
log.bodies=true
# Сколько байт тела печатать в консоль.
maxLogBytes=4096

# ---- SSO: аутентификация к цели через Waffle/JNA (нативный SSPI, Windows-only) ----
# SSO работает только для хостов из allowlist.
# По умолчанию — только Kerberos (sso.allowNtlm=false): тихого перехода на
# NTLM нет. Цели нужен правильный SPN HTTP/<имя хоста>; обращайтесь к ней по
# полному имени (FQDN), не по IP. Без билета к цели прокси отвечает 502
# SSO_KERBEROS_UNAVAILABLE и NTLM вместо Kerberos не отправляет.
sso.allowNtlm=false
# Действуют только при sso.allowNtlm=true (legacy-ресурсы без Kerberos):
# useNegotiate=true — сначала Negotiate; если цель предлагает только NTLM
#   (например, SharePoint без Kerberos), прокси сам переходит на NTLM;
# useNegotiate=false, useNtlm=true — сразу NTLM для всех хостов.
sso.useNtlm=true
sso.useNegotiate=true

# ---- SAP-профиль: сеанс на cookie и CSRF-токен ----
# Хосты SAP через запятую (host, host:port, *.suffix). Для них прокси держит
# сеанс на cookie между запросами (в том числе при SSO) и сам получает
# CSRF-токен перед POST, PUT, PATCH и DELETE: так работают, например, чтение
# данных таблиц в ADT (Data Preview) и изменяющие запросы OData. Хост должен
# быть и в allowlist. Пусто — профиль выключен.
sap.hosts=
# Путь, по которому прокси получает токен: GET с «X-CSRF-Token: Fetch».
sap.csrfFetchPath=/sap/bc/adt/discovery
# Через сколько секунд без запросов сеанс SAP забывается.
sap.sessionIdleSec=900

# ---- Режим проверки сертификатов цели ----
# SYSTEM_DEFAULT       — доверять хранилищу той Java, которой запущен прокси.
#                        Внимание: у старых сборок Java 8 в cacerts нет части
#                        современных корневых сертификатов, и публичные сайты
#                        отваливаются с "PKIX path building failed". Лечится
#                        режимом CUSTOM_CA (см. README) или свежей Java.
# CUSTOM_CA            — своё хранилище доверенных корней, путь ниже.
# INSECURE_TRUST_ALL   — принимать любой сертификат, только для разработки.
cert.mode=SYSTEM_DEFAULT

# Путь к хранилищу (.p12/.pfx читается как PKCS12, иначе как JKS).
# ВАЖНО: в properties-файле обратный слэш — escape-символ. Пишите путь через
# прямые слэши (C:/tools/truststore.jks) или удваивайте обратные
# (C:\\tools\\truststore.jks), иначе путь будет прочитан неверно.
cert.truststorePath=
cert.truststorePassword=
